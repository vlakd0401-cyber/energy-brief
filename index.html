<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230b5c7a%22/%3E%3Cpath d=%22M9 9h14M9 15h14M9 21h9%22 stroke=%22white%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<title>에너지부문 이슈 브리프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 신문 편집국 데스크 — 상단 회사 탭, 날짜별 브리핑 묶음, 카드 한 장 = 이슈 하나 */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#14212b; --ink-2:#4a5a66; --line:#dbe1e5;
  --accent:#0b5c7a; --accent-soft:#e2eff4;
  --hot:#b8461b; --hot-soft:#fbe9e1; --mid:#8a6a12; --mid-soft:#f6efd9;
  --tag:#eef1f3;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --ink:#e4ebef; --ink-2:#9aabb6; --line:#2a3842;
  --accent:#5fb3d3; --accent-soft:#16323f; --hot:#f08a5d; --hot-soft:#3a2219; --mid:#e0bf5c; --mid-soft:#332c16; --tag:#22303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --ink:#e4ebef; --ink-2:#9aabb6; --line:#2a3842;
  --accent:#5fb3d3; --accent-soft:#16323f; --hot:#f08a5d; --hot-soft:#3a2219; --mid:#e0bf5c; --mid-soft:#332c16; --tag:#22303a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
h1{margin:2px 0 0;font-size:28px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.status{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);text-align:right}
.status b{color:var(--ink);font-weight:500}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;font-weight:600;font-size:14.5px;padding:10px 14px 11px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11.5px;font-weight:500;background:var(--tag);color:var(--ink-2);border-radius:10px;padding:0 7px}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.scope{font-size:13.5px;color:var(--ink-2);margin:12px 0 0}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:14px 0 6px}
.group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.group .lbl{font-size:12px;color:var(--ink-2);margin-right:2px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
input#q{font:inherit;font-size:13.5px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:200px;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day{margin-top:26px}
.day h2{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:700;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.day h2 .d{font-family:var(--f-mono);font-weight:500}
.day h2 .c{font-size:12.5px;font-weight:400;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:10px}
article.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 14px;display:grid;grid-template-columns:4px 1fr;column-gap:14px;min-width:0}
.sev{border-radius:2px;background:var(--line)}
.card.i3 .sev{background:var(--hot)} .card.i2 .sev{background:var(--mid)}
.body{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.pill{font-weight:600;border-radius:4px;padding:1px 7px}
.pill.i3{background:var(--hot-soft);color:var(--hot)} .pill.i2{background:var(--mid-soft);color:var(--mid)} .pill.i1{background:var(--tag);color:var(--ink-2)}
.tag{background:var(--tag);color:var(--ink-2);border-radius:4px;padding:1px 7px}
.tag.co{background:var(--accent-soft);color:var(--accent)}
.src{color:var(--ink-2);font-family:var(--f-mono);font-size:11.5px;margin-left:auto}
h3{font-size:16.5px;line-height:1.45;margin:8px 0 2px;font-weight:700;text-wrap:balance}
.orig{font-size:12.5px;color:var(--ink-2);font-style:italic;margin:0 0 4px;overflow-wrap:anywhere}
ul.sum{margin:8px 0 0;padding-left:18px;max-width:72ch}
ul.sum li{margin:2px 0}
.imp{margin:10px 0 0;font-size:13.5px;background:var(--accent-soft);border-radius:6px;padding:7px 10px;max-width:80ch}
.imp b{color:var(--accent);font-weight:700;margin-right:6px}
.links{margin-top:10px;display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.links a{color:var(--accent);font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{margin-top:40px;padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);text-align:center}
.note{font-size:12.5px;color:var(--hot);margin-top:8px}
footer{margin-top:40px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){h1{font-size:23px}.status{text-align:left}.src{margin-left:0;width:100%}input#q{width:100%}article.card{padding:14px 14px 12px;column-gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">홍보3팀 · 에너지부문 데일리</div>
      <h1>에너지부문 이슈 브리프</h1>
    </div>
    <div class="status" id="status">업데이트 <b>평일 08:00 · 15:00</b><br><span id="last">불러오는 중…</span></div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <p class="scope" id="scope"></p>

  <div class="filters">
    <div class="group" id="typeGroup"><span class="lbl">구분</span></div>
    <div class="group" id="rangeGroup"><span class="lbl">기간</span></div>
    <div class="group" id="impGroup"><span class="lbl">중요도</span></div>
    <input id="q" type="search" placeholder="키워드 검색 (예: 관세, 변압기)" aria-label="키워드 검색">
  </div>
  <div id="note" class="note" hidden></div>

  <main id="feed"></main>

  <footer>공개된 기사·리포트·정책 자료를 AI(Claude)가 수집해 중요도를 판단하고 요약했습니다. 외신 제목과 요약은 한국어로 번역했고, 정확한 수치와 표현은 원문 링크에서 확인하세요.</footer>
</div>

<script>
(() => {
  const TABS = [
    {id:"all", name:"전체", scope:"모든 카테고리의 이슈를 한 번에 봅니다."},
    {id:"common", name:"공통", scope:"관세·통상, 유가·환율, 거시 정책 등 4개사에 공통으로 영향을 주는 이슈"},
    {id:"oilbank", name:"오일뱅크 · H&L", scope:"HD현대오일뱅크 및 계열사(정유), H&L어드밴스드(석유화학)"},
    {id:"electric", name:"일렉트릭", scope:"HD현대일렉트릭(전력기기) · 효성중공업, LS일렉트릭, Siemens Energy, GE Vernova, Hitachi Energy 동향 포함"},
    {id:"solar", name:"에너지솔루션", scope:"HD현대에너지솔루션(태양광 셀·모듈)"},
    {id:"hydrogen", name:"하이드로젠", scope:"HD하이드로젠(수소연료전지·SOFC)"},
  ];
  const TYPES = {all:"전체", domestic:"국내기사", foreign:"외신", report:"리포트", policy:"정책"};
  const RANGES = {all:"전체", "1":"오늘", "3":"3일", "7":"7일", "30":"30일"};
  const IMPS = {all:"전체", "3":"핵심만"};
  const IMP_LABEL = {3:"핵심", 2:"주요", 1:"참고"};
  const REGION = {KR:"한국", US:"미국", EU:"EU", GL:"글로벌", CN:"중국", JP:"일본", ME:"중동", IN:"인도"};
  const CAT_NAME = Object.fromEntries(TABS.map(t => [t.id, t.name]));

  const state = {tab:"all", type:"all", range:"7", imp:"all", q:"", items:[], loaded:false};
  try { const s = JSON.parse(localStorage.getItem("eb-filters")||"{}"); Object.assign(state, {type:s.type||"all", range:s.range||"7", imp:s.imp||"all"}); } catch(e){}
  const save = () => { try { localStorage.setItem("eb-filters", JSON.stringify({type:state.type, range:state.range, imp:state.imp})); } catch(e){} };

  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  function readHash(){ const h = location.hash.replace("#",""); state.tab = TABS.some(t => t.id === h) ? h : "all"; }
  readHash();
  window.addEventListener("hashchange", () => { readHash(); render(); });

  function chips(groupSel, dict, key){
    const g = $(groupSel);
    Object.entries(dict).forEach(([k, v]) => {
      const b = el("button", "chip", v); b.type = "button"; b.dataset.k = k;
      b.addEventListener("click", () => { state[key] = k; save(); render(); });
      g.appendChild(b);
    });
  }
  chips("#typeGroup", TYPES, "type"); chips("#rangeGroup", RANGES, "range"); chips("#impGroup", IMPS, "imp");
  let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 150); });

  const todayKST = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
  const daysAgo = d => { const t = new Date(todayKST()+"T00:00:00Z"); t.setUTCDate(t.getUTCDate() - (Number(d)-1)); return t.toISOString().slice(0,10); };
  const fmtDay = iso => { const d = new Date(iso+"T00:00:00Z"); const w = "일월화수목금토"[d.getUTCDay()]; return `${iso.slice(5,7)}.${iso.slice(8,10)} (${w})`; };
  const safeUrl = u => (typeof u === "string" && u.startsWith("https://")) ? u : null;

  function filtered(ignoreTab){
    const from = state.range === "all" ? "" : daysAgo(state.range);
    return state.items.filter(it =>
      (ignoreTab || state.tab === "all" || it.category === state.tab) &&
      (state.type === "all" || it.type === state.type) &&
      (state.imp === "all" || Number(it.importance) >= Number(state.imp)) &&
      (!from || (it.date||"") >= from) &&
      (!state.q || [it.title, it.originalTitle, it.source, it.impact || it.implication, ...(it.summary||[])].join(" ").toLowerCase().includes(state.q))
    );
  }

  function renderTabs(){
    const nav = $("#tabs"); nav.textContent = "";
    const base = filtered(true);
    TABS.forEach(t => {
      const b = el("button", "tab"); b.type = "button"; b.setAttribute("role","tab");
      b.setAttribute("aria-selected", String(state.tab === t.id));
      b.appendChild(el("span", null, t.name));
      const n = t.id === "all" ? base.length : base.filter(i => i.category === t.id).length;
      b.appendChild(el("span", "n", String(n)));
      b.addEventListener("click", () => { location.hash = t.id; });
      nav.appendChild(b);
    });
    $("#scope").textContent = TABS.find(t => t.id === state.tab).scope;
    document.querySelectorAll(".chip").forEach(c => {
      const key = c.parentElement.id === "typeGroup" ? "type" : c.parentElement.id === "rangeGroup" ? "range" : "imp";
      c.setAttribute("aria-pressed", String(state[key] === c.dataset.k));
    });
  }

  function card(it){
    const imp = Number(it.importance) || 1;
    const a = el("article", `card i${imp}`);
    a.appendChild(el("div", "sev"));
    const b = el("div", "body");
    const m = el("div", "meta");
    m.appendChild(el("span", `pill i${imp}`, IMP_LABEL[imp] || "참고"));
    m.appendChild(el("span", "tag", TYPES[it.type] || it.type || ""));
    if (it.region) m.appendChild(el("span", "tag", REGION[it.region] || it.region));
    if (state.tab === "all" && it.category) m.appendChild(el("span", "tag co", CAT_NAME[it.category] || it.category));
    m.appendChild(el("span", "src", [it.source, it.date].filter(Boolean).join(" · ")));
    b.appendChild(m);
    b.appendChild(el("h3", null, it.title || ""));
    if (it.originalTitle) b.appendChild(el("p", "orig", "원제: " + it.originalTitle));
    if (Array.isArray(it.summary) && it.summary.length){
      const ul = el("ul", "sum"); it.summary.forEach(s => ul.appendChild(el("li", null, String(s)))); b.appendChild(ul);
    }
    const impact = it.impact || it.implication;
    if (impact){
      const p = el("p", "imp"); p.appendChild(el("b", null, "영향 포인트")); p.appendChild(document.createTextNode(impact)); b.appendChild(p);
    }
    const links = el("div", "links");
    const u = safeUrl(it.url);
    if (u){ const l = el("a", null, "원문 보기 ↗"); l.href = u; l.target = "_blank"; l.rel = "noopener noreferrer"; links.appendChild(l); }
    (Array.isArray(it.extraLinks) ? it.extraLinks : []).forEach(x => { const xu = safeUrl(x && x.url); if (xu){ const l = el("a", null, (x.label||"관련 자료") + " ↗"); l.href = xu; l.target="_blank"; l.rel="noopener noreferrer"; links.appendChild(l);} });
    if (links.childNodes.length) b.appendChild(links);
    a.appendChild(b);
    return a;
  }

  function render(){
    renderTabs();
    const feed = $("#feed"); feed.textContent = "";
    if (!state.loaded){ feed.appendChild(el("div","empty","이슈를 불러오는 중입니다…")); return; }
    if (!state.items.length){ feed.appendChild(el("div","empty","아직 수집된 이슈가 없습니다. 평일 08:00과 15:00에 새 이슈가 자동으로 추가됩니다.")); return; }
    const list = filtered(false).sort((x,y) => (y.date||"").localeCompare(x.date||"") || (Number(y.importance)||0)-(Number(x.importance)||0) || (y.addedAt||"").localeCompare(x.addedAt||""));
    if (!list.length){
      const box = el("div","empty","선택한 기간에는 이 탭의 새 이슈가 없습니다. ");
      if (state.range !== "30" && state.range !== "all"){ const b = el("button","chip","최근 30일 보기"); b.type="button"; b.addEventListener("click",()=>{state.range="30"; save(); render();}); box.appendChild(b); }
      feed.appendChild(box); return;
    }
    const byDay = new Map(); list.forEach(it => { const d = it.date || "날짜 미상"; if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(it); });
    byDay.forEach((items, d) => {
      const sec = el("section","day"); const h = el("h2");
      h.appendChild(el("span","d", d.length === 10 ? fmtDay(d) : d)); h.appendChild(el("span","c", `${items.length}건`));
      sec.appendChild(h); const l = el("div","list"); items.forEach(it => l.appendChild(card(it))); sec.appendChild(l); feed.appendChild(sec);
    });
  }
  render();

  (async () => {
    const note = $("#note");
    try {
      const v = "?t=" + Math.floor(Date.now()/60000);
      const [ir, mr] = await Promise.all([fetch("data/issues.json"+v, {cache:"no-store"}), fetch("data/meta.json"+v, {cache:"no-store"})]);
      if (!ir.ok) throw new Error("HTTP " + ir.status);
      const items = await ir.json();
      state.items = Array.isArray(items) ? items : [];
      try { const m = mr.ok ? await mr.json() : null; $("#last").textContent = m && m.lastUpdated ? "최근 갱신 " + m.lastUpdated : "최근 갱신 기록 없음"; } catch(e){ $("#last").textContent = ""; }
    } catch (e) {
      note.hidden = false; note.textContent = "이슈 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
      $("#last").textContent = "";
    }
    state.loaded = true; render();
  })();
})();
</script>
</body>
</html>
